[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdrseqgen"
version = "0.1.0"
description = "Unified framework and matched benchmarking harness for antibody CDR sequence infilling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Xihern Pang", email = "pang0275@e.ntu.edu.sg" },
]
keywords = ["antibodies", "CDR-H3", "protein language models", "bioinformatics", "benchmarking"]

[tool.setuptools.packages.find]
include = ["cdrseqgen*", "benchmark*", "experiments*"]
